name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter ${{ matrix.flutter-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.47.8']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Report toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format .
          git diff --check
          git diff --exit-code

      - name: Analyze package
        run: flutter analyze --fatal-infos

      - name: Test package
        run: flutter test

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Test example
        working-directory: example
        run: flutter test

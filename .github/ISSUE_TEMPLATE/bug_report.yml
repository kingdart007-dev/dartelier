name: Bug report
description: Report a reproducible problem in Dartelier.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please avoid posting secrets or personal data. For security vulnerabilities, use the private reporting route described in SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Configure ... 2. Render ... 3. Tap ..."
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "3.47.8"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
        - Not platform-specific
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add minimal code or screenshots if they help explain the issue.
    validations:
      required: false
